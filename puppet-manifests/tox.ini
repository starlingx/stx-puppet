# Tox (http://tox.testrun.org/) is a tool for running tests
# in multiple virtualenvs. This configuration file will run the
# test suite on all supported python versions. To use it, "pip install tox"
# and then run "tox" from this directory.
[tox]
toxworkdir = /tmp/{env:USER}_puppet-manifests
envlist = py39,puppetlint
skipsdist = True

[testenv]
recreate = True

[testenv:py39]
basepython = python3.9
sitepackages = False

setenv = VIRTUAL_ENV={envdir}
         OS_TEST_PATH=./tests

deps =
    -r{toxinidir}/test-requirements-bullseye.txt

commands =
  stestr run {posargs}
  stestr slowest

[testenv:puppetlint]
# Note: centos developer env requires ruby-devel
# Ubuntu developer env requires ruby-dev
deps =
allowlist_externals =
    gem
    bash
setenv =
    GEM_HOME = {envdir}
    GEM_PATH = {envdir}
# skip_tests: common lint options for all distros (including trixie)
skip_tests = \
    --fail-on-warnings \
    --no-autoloader_layout-check \
    --no-documentation-check \
    --no-variable_scope-check
# skip_tests_bullseye: additional options only needed for bullseye
skip_tests_bullseye = \
    --fail-on-warnings \
    --no-autoloader_layout-check \
    --no-documentation-check
commands =
    gem install --no-document json puppet-lint:2.3.6
    bash -c "find {toxinidir} -path '*/debian/trixie/*.pp' -print0 \
                | xargs -r -0 puppet-lint {[testenv:puppetlint]skip_tests}"
    bash -c "find {toxinidir} -path '*/debian/bullseye/*.pp' -print0 \
                | xargs -r -0 puppet-lint {[testenv:puppetlint]skip_tests_bullseye}"
    bash -c "find {toxinidir} -path '*/debian/all/*.pp' -print0 \
                | xargs -r -0 puppet-lint {[testenv:puppetlint]skip_tests}"


[testenv:coverage]
basepython = python3.9
sitepackages = False
setenv =
    VIRTUAL_ENV={envdir}
    OS_TEST_PATH=./tests
deps =
    -r{toxinidir}/test-requirements-bullseye.txt
    pytest
    pytest-cov
allowlist_externals =
    bash
    mkdir
commands =
    mkdir -p {toxinidir}/../UTCoverage
    bash -c "set -o pipefail; cd {toxinidir} && python -m pytest tests/ \
        --cov=debian/bullseye/src/bin \
        --cov=debian/bullseye/src/modules/platform/files \
        --cov-report=term-missing \
        --cov-report=html:{toxinidir}/../UTCoverage/htmlcov \
        --cov-config={toxinidir}/../.coveragerc \
        -v --tb=short 2>&1 | tee {toxinidir}/../UTCoverage/coverage_report.txt; \
        rc=$?; cp .coverage {toxinidir}/../UTCoverage/ 2>/dev/null; exit $rc"

[testenv:coverage-trixie]
basepython = {[trixie]basepython}
sitepackages = False
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps =
    -r{toxinidir}/test-requirements-trixie.txt
    pytest
    pytest-cov
allowlist_externals =
    bash
    mkdir
commands =
    mkdir -p {toxinidir}/../UTCoverage
    bash -c "set -o pipefail; \
        rm -f {toxinidir}/debian/bullseye/src.bak_trixie; \
        mv {toxinidir}/debian/bullseye/src \
           {toxinidir}/debian/bullseye/src.bak_trixie; \
        ln -s {toxinidir}/debian/trixie/src \
              {toxinidir}/debian/bullseye/src; \
        cd {toxinidir} && python -m pytest tests/ \
            --cov=debian/bullseye/src/bin \
            --cov=debian/bullseye/src/modules/platform/files \
            --cov-report=term-missing \
            --cov-report=html:{toxinidir}/../UTCoverage/htmlcov-trixie \
            --cov-config={toxinidir}/../.coveragerc \
            -v --tb=short 2>&1 | tee {toxinidir}/../UTCoverage/coverage_report_trixie.txt; \
        rc=$?; \
        rm -f {toxinidir}/debian/bullseye/src; \
        mv {toxinidir}/debian/bullseye/src.bak_trixie \
           {toxinidir}/debian/bullseye/src; \
        exit $rc"

[trixie]
basepython = python3.13
setenv =
    VIRTUAL_ENV={envdir}
    OS_TEST_PATH=./tests
    UPPER_CONSTRAINTS_FILE=https://opendev.org/starlingx/root/raw/branch/master/build-tools/requirements/debian/trixie/upper-constraints.txt
install_command = pip install -c{env:UPPER_CONSTRAINTS_FILE} -U {opts} {packages}

[testenv:py313]
basepython = {[trixie]basepython}
sitepackages = False
setenv = {[trixie]setenv}
install_command = {[trixie]install_command}
deps =
    -r{toxinidir}/test-requirements-trixie.txt
allowlist_externals =
    bash
commands =
    bash -c "rm -f {toxinidir}/debian/bullseye/src.bak_trixie; \
        mv {toxinidir}/debian/bullseye/src \
           {toxinidir}/debian/bullseye/src.bak_trixie; \
        ln -s {toxinidir}/debian/trixie/src \
              {toxinidir}/debian/bullseye/src; \
        stestr run {posargs}; \
        rc=$?; \
        rm -f {toxinidir}/debian/bullseye/src; \
        mv {toxinidir}/debian/bullseye/src.bak_trixie \
           {toxinidir}/debian/bullseye/src; \
        exit $rc"
