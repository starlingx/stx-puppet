[process]
process  = charon-systemd
service  = strongswan
style    = lsb            ; ocf or lsb
severity = major          ; minor, major, critical
restarts = 3              ; restart retries before error assertion
interval = 5              ; number of seconds to wait between restarts
debounce = 20             ; number of seconds that a process needs to remain
                          ;   running before degrade is removed and retry count
                          ;   is cleared.
startuptime  = 60         ; Seconds to wait after process start before starting the debounce monitor
                          ;   Set to 60s to allow strongswan time to start on first boot after upgrade
                          ;   (LUKS filesystem and IPsec certs may not be ready immediately)
mode  = passive           ; Monitoring mode: passive (default) or active
                          ; passive: process death monitoring (default: always)
                          ; active : heartbeat monitoring, i.e. request / response messaging
                          ; ignore : do not monitor or stop monitoring
